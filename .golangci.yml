version: "2"

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - revive
    - gosec
    - misspell
  exclusions:
    rules:
      # Tests use fake tokens and httptest URLs; gosec's hardcoded-credential
      # and SSRF-style checks are noise there.
      - path: _test\.go
        linters: [gosec]

formatters:
  enable:
    - gofmt
