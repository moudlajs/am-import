version: "2"

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - revive
    - gosec
    - misspell
  settings:
    errcheck:
      # Writes to stdout/stderr: if the terminal is gone there is no one to
      # report to. Where it matters (tabwriter.Flush) the error is checked.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
  exclusions:
    rules:
      # Tests use fake tokens and httptest URLs; gosec's hardcoded-credential
      # and SSRF-style checks are noise there.
      - path: _test\.go
        linters: [gosec]

formatters:
  enable:
    - gofmt
