version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # x/text v0.35.0+ requires Go 1.25, and go.mod promises 1.24. Remove
      # this when the minimum Go version (and the CI matrix) moves up.
      - dependency-name: golang.org/x/text
        versions: [">= 0.35.0"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
