name: Claude review

# `review` is a required check, so a green result must mean a review
# happened. Every step below exists because of a way it once went green
# without one - see "Things that have already bitten" in CLAUDE.md.

on:
  pull_request:
    # Drafts get a no-op run (see the first step). ready_for_review is the
    # event that matters: marking a draft ready is what asks for a review.
    # synchronize re-reviews fixes pushed after that.
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

# One group per event type. A group holds a single pending run and a new
# one replaces it regardless of cancel-in-progress, so if comments shared
# the PR group, any comment (including Claude's own summary) could replace
# a queued review and leave `review` cancelled.
concurrency:
  group: claude-review-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    # Dependabot PRs are skipped, deliberately: Dependabot gets no secrets,
    # so a run could only fail. A skipped required check passes, so those
    # PRs are gated by CI alone. For comments, fire only on an explicit
    # @claude mention on a pull request.
    #
    # Draft state is deliberately NOT decided here from the payload alone;
    # see the first step.
    if: |
      (github.event_name == 'pull_request' &&
       github.event.pull_request.user.login != 'dependabot[bot]') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    defaults:
      run:
        # Explicit `shell: bash` adds -o pipefail, so a failing `gh api` in
        # a pipeline fails the step instead of producing an empty count.
        shell: bash
    steps:
      # The payload is a snapshot: a push landing just before `gh pr ready`
      # produces a run whose payload still says draft, and that run cancels
      # the ready one (#16). The live API can lag the other way. So skip
      # only when BOTH say draft; a ready_for_review payload never does.
      - name: Skip drafts
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
          PAYLOAD_DRAFT: ${{ github.event.pull_request.draft || false }}
        run: |
          live="$(gh pr view "$PR" --repo "$REPO" --json isDraft --jq .isDraft)"
          draft=false
          if [ "$PAYLOAD_DRAFT" = "true" ] && [ "$live" = "true" ]; then draft=true; fi
          echo "draft=$draft" >> "$GITHUB_OUTPUT"
          echo "started=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          if [ "$draft" = "true" ]; then
            echo "PR #$PR is a draft - no review. Mark it ready to request one."
          fi

      - uses: actions/checkout@v7
        if: steps.draft.outputs.draft != 'true'
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        if: steps.draft.outputs.draft != 'true'
        with:
          # Minted with `claude setup-token` - the Claude subscription, not a
          # metered API key.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Without these the review runs and then has no permission to post
          # anything; the log says "No buffered inline comments".
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(go test:*),Bash(go vet:*),Bash(go build:*)"

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}

            The PR branch is checked out in the working directory. You did not
            write this code; review it as an independent reviewer.

            Post findings as GitHub comments, not as a returned message, or
            nobody will see them:
              - `mcp__github_inline_comment__create_inline_comment` with
                `confirmed: true` for a specific line
              - `gh pr comment` for the overall summary. You MUST post this
                summary, and only once you have actually completed the
                review. Its first line MUST be exactly:
                  ## Claude review
                A workflow step checks for that heading; without it the
                review counts as not done. If you could not review (missing
                files, tool errors), post a comment WITHOUT that heading
                explaining why.

            Read CLAUDE.md and CONTRIBUTING.md first; review against them.
            Focus, in order:

            1. Token leakage. AM_DEV_TOKEN / AM_USER_TOKEN values must never
               reach logs, error messages, test fixtures that look real, or
               committed files. Check every slog call and fmt.Errorf that
               touches a request, header or config.
            2. Correctness of the matching logic in internal/matcher:
               normalisation, karaoke/tribute rejection, artist-before-title
               preference, deterministic tie-breaking, and whether the tests
               actually cover the edge cases they claim to.
            3. Idiomatic Go and error handling: errors wrapped with %w,
               sentinel errors checkable with errors.Is, context respected
               end to end, no ignored errors, resources closed.
            4. Over-engineering. This tool is deliberately small and
               sequential. Flag interfaces with one implementation, goroutines,
               config frameworks, new dependencies, or abstractions the task
               did not ask for. Standard library only, except golang.org/x/text.
            5. Tests: table-driven, no real network, t.Setenv not os.Setenv.

            Be specific: file:line, a concrete failing scenario, a suggested
            fix. If you find nothing significant, say so plainly rather than
            padding. Do not approve or merge.

      # The action exits green without reviewing in some cases, notably when
      # the PR changes this workflow file: it refuses to run a workflow that
      # differs from the default branch's (#17). So require the summary it
      # was told to post, from claude[bot], during this run.
      - name: Verify a review was actually posted
        if: steps.draft.outputs.draft != 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          STARTED: ${{ steps.draft.outputs.started }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          count() {  # count PR comments whose author and first line match
            gh api "repos/$REPO/issues/$PR/comments" --paginate \
              --jq "[.[] | select(.user.login == \"$1\" and .created_at >= \"$2\" and (.body | startswith(\"$3\")))] | length" \
              | awk '{s+=$1} END {print s+0}'
          }

          if [ "$(count 'claude[bot]' "$STARTED" '## Claude review')" -gt 0 ]; then
            echo "ok - review posted"; exit 0
          fi

          wf=.github/workflows/claude-review.yml
          if git diff --quiet "origin/$DEFAULT_BRANCH" HEAD -- "$wf"; then
            echo "::error::No '## Claude review' comment from claude[bot] since $STARTED. The action did not complete a review; check its log."
            exit 1
          fi

          # This PR changes the review workflow, so the action cannot review
          # it. Allowed only if the PR is limited to workflows and docs, and
          # a manual independent review has been posted (CLAUDE.md).
          other="$(git diff --name-only "origin/$DEFAULT_BRANCH" HEAD \
                    | grep -vE '^\.github/workflows/[^/]+\.ya?ml$|\.md$' || true)"
          if [ -n "$other" ]; then
            echo "::error::This PR changes $wf, which the action cannot review, AND other files it must review:"
            echo "$other"
            echo "Split the workflow change into its own PR."
            exit 1
          fi
          # The manual review must be newer than the head commit, so a review
          # of an earlier version does not cover later pushes.
          head_time="$(TZ=UTC git show -s --date=format-local:%Y-%m-%dT%H:%M:%SZ --format=%cd "$HEAD_SHA")"
          if [ "$(count 'moudlajs' "$head_time" '## Independent review (manual')" -eq 0 ]; then
            echo "::error::This PR changes $wf, which the action cannot review. Post an independent review of $HEAD_SHA (heading '## Independent review (manual') per CLAUDE.md, then re-run this job."
            exit 1
          fi
          echo "::warning::Review workflow change - accepted on a manual independent review, not the action."
