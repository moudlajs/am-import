name: Claude review

on:
  pull_request:
    # Drafts get a no-op run (see the first step). ready_for_review is the
    # event that matters: marking a draft ready is what asks for a review.
    # synchronize re-reviews fixes pushed after that.
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

# Cancel only for new pushes. Workflow-level concurrency is evaluated before
# the job-level `if`, so without this guard any comment on the PR would
# cancel a running review and then skip itself.
concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    # Dependabot gets no secrets, so a run would only fail. For comments,
    # fire only on an explicit @claude mention on a pull request.
    #
    # Draft state is deliberately NOT checked here: the event payload is a
    # snapshot. A push landing just before `gh pr ready` produces a run
    # that still says draft, skips, and cancels the real review, and a
    # skipped required check counts as passing (#16). It is checked live
    # in the first step instead.
    if: |
      (github.event_name == 'pull_request' &&
       github.event.pull_request.user.login != 'dependabot[bot]') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    steps:
      - name: Skip drafts (checked live, not from the event payload)
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          draft="$(gh pr view "$PR" --repo "$REPO" --json isDraft --jq .isDraft)"
          echo "draft=$draft" >> "$GITHUB_OUTPUT"
          echo "started=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          if [ "$draft" = "true" ]; then
            echo "PR #$PR is a draft - no review. Mark it ready to request one."
          fi

      - uses: actions/checkout@v7
        if: steps.draft.outputs.draft != 'true'
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        if: steps.draft.outputs.draft != 'true'
        with:
          # Minted with `claude setup-token` - the Claude subscription, not a
          # metered API key.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Without these the review runs and then has no permission to post
          # anything; the log says "No buffered inline comments".
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(go test:*),Bash(go vet:*),Bash(go build:*)"

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}

            The PR branch is checked out in the working directory. You did not
            write this code; review it as an independent reviewer.

            Post findings as GitHub comments, not as a returned message, or
            nobody will see them:
              - `gh pr comment` for the overall summary
              - `mcp__github_inline_comment__create_inline_comment` with
                `confirmed: true` for a specific line

            Read CLAUDE.md and CONTRIBUTING.md first; review against them.
            Focus, in order:

            1. Token leakage. AM_DEV_TOKEN / AM_USER_TOKEN values must never
               reach logs, error messages, test fixtures that look real, or
               committed files. Check every slog call and fmt.Errorf that
               touches a request, header or config.
            2. Correctness of the matching logic in internal/matcher:
               normalisation, karaoke/tribute rejection, artist-before-title
               preference, deterministic tie-breaking, and whether the tests
               actually cover the edge cases they claim to.
            3. Idiomatic Go and error handling: errors wrapped with %w,
               sentinel errors checkable with errors.Is, context respected
               end to end, no ignored errors, resources closed.
            4. Over-engineering. This tool is deliberately small and
               sequential. Flag interfaces with one implementation, goroutines,
               config frameworks, new dependencies, or abstractions the task
               did not ask for. Standard library only, except golang.org/x/text.
            5. Tests: table-driven, no real network, t.Setenv not os.Setenv.

            Be specific: file:line, a concrete failing scenario, a suggested
            fix. If you find nothing significant, say so plainly rather than
            padding. Do not approve or merge.

      # The action exits green without reviewing in some cases, notably when
      # the PR changes this workflow file (it refuses to run a workflow that
      # differs from main's). A green `review` must mean a review happened,
      # so require a comment from claude[bot] posted during this run.
      - name: Verify a review was actually posted
        if: steps.draft.outputs.draft != 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          STARTED: ${{ steps.draft.outputs.started }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          n="$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
                --jq "[.[] | select(.user.login == \"claude[bot]\" and .created_at >= \"$STARTED\")] | length" \
              | awk '{s+=$1} END {print s+0}')"
          if [ "$n" -gt 0 ]; then echo "ok - review posted"; exit 0; fi

          if ! git diff --quiet "origin/$BASE" HEAD -- .github/workflows/claude-review.yml; then
            echo "::warning::This PR changes claude-review.yml, which claude-code-action refuses to run on. It needs an independent review posted by hand before merging - see CLAUDE.md."
            exit 0
          fi

          echo "::error::No review comment from claude[bot] since $STARTED. The action ran but did not review; check its log."
          exit 1
